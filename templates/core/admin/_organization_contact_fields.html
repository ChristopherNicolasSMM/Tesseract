{% for field, caption, limit in [('name','Nome',120), ('role','Função',80), ('cpf','CPF (opcional)',14), ('email','E-mail',254), ('phone','Telefone',25)] %}
<div class="col-md-4"><label class="form-label" for="contact-{{ item.id }}-{{ contact.id if contact else 'new' }}-{{ field }}">{{ caption }}</label><input id="contact-{{ item.id }}-{{ contact.id if contact else 'new' }}-{{ field }}" class="form-control" name="{{ field }}" maxlength="{{ limit }}" value="{{ contact|attr(field) or '' if contact else '' }}" {% if field in ['name','role'] %}required{% endif %}></div>
{% endfor %}
<div class="col-md-4"><label class="form-check-label"><input class="form-check-input" type="checkbox" name="is_active" {% if not contact or contact.is_active %}checked{% endif %}> Ativo</label><button class="btn btn-outline-primary ms-2">Salvar responsável</button></div>
