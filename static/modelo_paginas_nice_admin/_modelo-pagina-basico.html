<!--
  MODELO BÁSICO DE PÁGINA CUSTOMIZADA — Tesseract

  Ponto de partida enxuto. Para o modelo completo (abas, os três
  caminhos de dado, formulário, tratamento de erro e escape de XSS),
  veja _modelo-pagina-completo.html nesta mesma pasta, e o fluxo
  explicado em docs/skills/17-paginas-customizadas-fluxo-de-dados.md.

  Copie os blocos que precisar para o editor em
  /admin/designer/<id>/edit.

  REGRAS:
  - Não escreva <html>, <head> ou <body>: este conteúdo é inserido
    dentro do layout do sistema, que já carrega Bootstrap 5,
    Bootstrap Icons e o tema (claro/escuro) do Tesseract.
  - Use as classes do Bootstrap/NiceAdmin. Os demais arquivos desta
    pasta são a referência visual completa de cada componente.
  - Para dado dinâmico, use JavaScript chamando uma Ação de Dado
    (ver o último bloco). Nunca chame o provedor OData direto do
    navegador: a Ação de Dado roda no servidor e é o único ponto que
    conhece a credencial da conexão.
  - Este arquivo começa com "_" para não se confundir com as páginas
    de referência do NiceAdmin ao lado.
-->

<!-- ═══ Dados dinâmicos via Ação de Dado ══════════════════════════ -->
<!--
  Troque ID_DA_ACAO pelo id da Ação de Dado (listados no painel lateral
  do editor). operation="query" devolve {result: {value: [...]}}.
-->
<script>
(function () {
  const ID_DA_ACAO = 1;

  function chamarAcao(id, corpo) {
    return fetch('/admin/designer/data-action/' + id + '/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo || {}),
    }).then(function (r) { return r.json(); });
  }

  chamarAcao(ID_DA_ACAO).then(function (resposta) {
    if (!resposta.success) {
      console.error('Ação de Dado falhou:', resposta.error);
      return;
    }
    const linhas = resposta.result.value || [];

    const indicador = document.getElementById('indicador-valor');
    if (indicador) indicador.textContent = linhas.length;

    const corpo = document.getElementById('tabela-corpo');
    if (!corpo) return;
    corpo.innerHTML = linhas.map(function (linha, i) {
      return '<tr><th scope="row">' + (i + 1) + '</th>' +
             '<td>' + (linha.name || '') + '</td>' +
             '<td>' + (linha.status || '') + '</td></tr>';
    }).join('') || '<tr><td colspan="3" class="text-muted">Nenhum registro.</td></tr>';
  });

  const botao = document.getElementById('btn-salvar');
  if (botao) {
    botao.addEventListener('click', function () {
      // operation="update" exige `key` (id do registro) e `payload`.
      chamarAcao(ID_DA_ACAO, {
        key: '1',
        payload: { name: document.getElementById('campo-nome').value },
      }).then(function (resposta) {
        window.__tesseractToast && window.__tesseractToast.show(
          resposta.success ? 'Salvo.' : (resposta.error || 'Falha ao salvar.'),
          resposta.success ? 'success' : 'error'
        );
      });
    });
  }
})();
</script>
