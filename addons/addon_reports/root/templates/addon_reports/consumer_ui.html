<div class="modal fade" id="reports-consumer-modal" tabindex="-1" aria-labelledby="reports-consumer-title" aria-hidden="true">
  <div class="modal-dialog modal-xl"><div class="modal-content">
    <form id="reports-consumer-form">
      <div class="modal-header"><h2 class="modal-title fs-5" id="reports-consumer-title">{{ t('reports.consumer.title') }}</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ t('reports.close') }}"></button></div>
      <div class="modal-body">
        <p class="small text-muted">{{ t('reports.consumer.hint') }}</p>
        <label class="form-label" for="reports-consumer-template">{{ t('reports.model') }}</label>
        <select id="reports-consumer-template" class="form-select mb-3" required></select>
        <label class="form-label" for="reports-consumer-parameters">{{ t('reports.parameters') }}</label>
        <fieldset id="reports-consumer-parameter-fields"></fieldset><label for="reports-consumer-parameters" class="form-label">{{ t('reports.values_json') }}</label><textarea id="reports-consumer-parameters" class="form-control font-monospace" rows="4" spellcheck="false">{}</textarea>
        <div id="reports-consumer-status" class="mt-3" role="status" aria-live="polite"></div>
        <div id="reports-consumer-preview-panel" hidden><p class="small text-muted mt-3">{{ t('reports.print_hint') }}</p><iframe id="reports-consumer-preview" title="{{ t('reports.preview') }}" sandbox="allow-same-origin allow-modals" style="width:100%;height:60vh;border:0"></iframe></div>
      </div>
      <div class="modal-footer"><button id="reports-consumer-print" type="button" class="btn btn-outline-primary" disabled>{{ t('reports.print') }}</button><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">{{ t('reports.close') }}</button><button id="reports-consumer-submit" type="submit" class="btn btn-primary"><i class="bi bi-file-earmark-text"></i> {{ t('reports.consumer.download') }}</button></div>
    </form>
  </div></div>
</div>
