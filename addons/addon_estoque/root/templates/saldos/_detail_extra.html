{# O material é contexto de leitura; o CrudGen só edita os limites do saldo. #}
<section class="section">
  <div class="card">
    <div class="card-body">
      <h2 class="h5 mt-3">Material</h2>
      {% if item.material %}
      <a href="{{ url_for('materials.detail', id=item.material_id) }}">{{ item.material.nome }}</a>
      {% else %}
      <span>Material #{{ item.material_id }}</span>
      {% endif %}
    </div>
  </div>
</section>
