<script src="{{ url_for('static', filename='vendor/chart.js/chart.umd.js') }}"></script>
<script>
(function () {
  'use strict';
  const layoutId = {{ layout.id }};
  const snapshotUrl = "{{ url_for('dashboard_runtime.snapshot', layout_id=layout.id) }}";
  const setValueUrlTemplate = "{{ url_for('dashboard_runtime.set_value', widget_id=0) }}";
  const readingsUrlTemplate = "{{ url_for('dashboard_runtime.readings', session_id=0) }}";
  const geometryUrlTemplate = "{{ url_for('dashboard_runtime.update_geometry', widget_id=0) }}";
  const configUrlTemplate = "{{ url_for('dashboard_runtime.update_config', widget_id=0) }}";
  const deleteUrlTemplate = "{{ url_for('dashboard_runtime.delete_widget', widget_id=0) }}";
  const createWidgetUrl = "{{ url_for('dashboard_runtime.create_widget', layout_id=layout.id) }}";
  const uploadImageUrl = "{{ url_for('dashboard_runtime.upload_image') }}";
  const advanceStepUrlTemplate = "{{ url_for('dashboard_runtime.advance_step', session_id=0) }}";
  const goBackStepUrlTemplate = "{{ url_for('dashboard_runtime.go_back_step', session_id=0) }}";
  const resyncStepsUrlTemplate = "{{ url_for('dashboard_runtime.resync_steps', session_id=0) }}";
  const recipeStepsJsonUrlTemplate = "{{ url_for('recipe_timeline.steps_json', recipe_id=0) }}";
  const recipeAddStepUrlTemplate = "{{ url_for('recipe_timeline.add_step', recipe_id=0) }}";
  const recipeUpdateStepUrlTemplate = "{{ url_for('recipe_timeline.update_step', step_id=0) }}";
  const recipeDeleteStepUrlTemplate = "{{ url_for('recipe_timeline.delete_step', step_id=0) }}";
  {% if layout.plant_id %}
  const connectionsUrl = "{{ url_for('dashboard_runtime.update_connections', layout_id=layout.id) }}";
  {% endif %}
  const charts = {};
  let editMode = false;
  let lastSnapshot = null;

  // ── Editor de tubulação CAD-like (conversa — Ponto 1) ───────────────────
  // pipesState espelha data.connections (já com from_anchor/to_anchor/
  // waypoints resolvidos pelo backend) — é a fonte de verdade em runtime
  // pra desenhar as alças de edição e pra persistir mudanças de geometria.
  let pipesState = [];
  let selectedPipeIndex = null;
  let selectedWaypointIndex = null;
  let pipeDragState = null; // { pipeIndex, kind: 'waypoint'|'anchor'|'new-waypoint', ... }

  function widgetIdUrl(template, id) { return template.replace('/0/', '/' + id + '/'); }

  function fmtValue(v, decimals) {
    if (v === null || v === undefined) return '—';
    if (typeof v === 'number' && decimals !== undefined) return v.toFixed(decimals);
    if (typeof v === 'boolean') return v ? 'Ligado' : 'Desligado';
    return String(v);
  }

  function fillColorForTemp(temp) {
    if (temp === null || temp === undefined) return '#c0392b';
    if (temp < 35) return '#3498db';
    if (temp < 75) return '#e67e22';
    return '#c0392b';
  }

  function renderVessel(el, data) {
    const roles = (data && data.roles) || {};
    const config = JSON.parse(el.dataset.configJson || '{}');
    const manualEnabled = config.manual_control_enabled !== false; // default: permitido (compatível com o que já existia)
    let tempRole = null;
    Object.keys(roles).forEach(function (key) {
      if (key.indexOf('sensor_temp') !== -1 || key.indexOf('temp') !== -1) tempRole = roles[key];
    });
    el.querySelector('.db-vessel-temp').textContent = tempRole ? fmtValue(tempRole.value, 1) + (tempRole.unit || '') : '—';

    const fillRect = el.querySelector('.db-vessel-fill-rect');
    if (fillRect) {
      const fillRoleKey = el.dataset.fillRoleKey;
      let pct = 0.55; // nível decorativo padrão, sem sensor de volume configurado
      if (fillRoleKey && roles[fillRoleKey] && typeof roles[fillRoleKey].value === 'number') {
        const r = roles[fillRoleKey];
        const min = r.min_value || 0, max = r.max_value || 100;
        pct = Math.max(0, Math.min(1, (r.value - min) / ((max - min) || 1)));
      }
      const totalHeight = 120 - 4;
      fillRect.setAttribute('y', String(4 + totalHeight * (1 - pct)));
      fillRect.setAttribute('fill', fillColorForTemp(tempRole ? tempRole.value : null));
    }

    const rolesWrap = el.querySelector('.db-vessel-roles');
    rolesWrap.innerHTML = '';
    Object.keys(roles).forEach(function (roleKey) {
      const r = roles[roleKey];
      const isActuator = roleKey.indexOf('actor_') === 0;
      // Achado da conversa: com acionamento manual desligado, o atuador
      // não aparece mais aqui (nem travado) — o usuário controla ele por
      // um widget Botão à parte. Leitura de sensor continua sempre.
      if (isActuator && !manualEnabled) return;
      const badge = document.createElement(isActuator ? 'button' : 'span');
      badge.className = 'badge ' + (r.value ? 'bg-success' : 'bg-secondary') + (isActuator ? ' border-0' : '');
      badge.style.cursor = isActuator ? 'pointer' : 'default';
      badge.textContent = r.label + (isActuator ? '' : ': ' + fmtValue(r.value, 1) + (r.unit || ''));
      if (isActuator) {
        badge.addEventListener('click', function () {
          maybeConfirmAndSetValue(el, !r.value, roleKey);
        });
      }
      rolesWrap.appendChild(badge);
    });
  }

  function maybeConfirmAndSetValue(el, value, roleKey) {
    const config = JSON.parse(el.dataset.configJson || '{}');
    if (config.confirm_before_actuate && !confirm('Confirma acionar "' + (el.dataset.labelText || 'este atuador') + '"?')) {
      return;
    }
    postSetValue(el.dataset.widgetId, value, roleKey);
  }

  // Achado real: o widget "toggle" dedicado nunca teve clique conectado —
  // só os badges de atuador dentro do tanque funcionavam.
  document.addEventListener('click', function (e) {
    const toggleBtn = e.target.closest('.db-toggle');
    if (!toggleBtn || toggleBtn.disabled) return;
    if (editMode) return; // no modo edição, clicar é pra arrastar/selecionar, não acionar
    const data = lastSnapshot && lastSnapshot.widgets ? lastSnapshot.widgets[toggleBtn.dataset.widgetId] : null;
    const currentValue = data ? data.value : null;
    maybeConfirmAndSetValue(toggleBtn, !currentValue, null);
  });

  // Card de Etapa (conversa — Ponto 2): "Concluir e Avançar" sempre
  // disponível, não só quando o timer sugere.
  document.addEventListener('click', function (e) {
    const advanceBtn = e.target.closest('.db-step-advance-btn');
    if (!advanceBtn || editMode) return;
    const sessionId = lastSnapshot && lastSnapshot.active_session_id;
    if (!sessionId) return;
    advanceBtn.disabled = true;
    fetch(widgetIdUrl(advanceStepUrlTemplate, sessionId), { method: 'POST' })
      .then(function () { refresh(); })
      .finally(function () { advanceBtn.disabled = false; });
  });

  // "Voltar" (conversa — inspirado no painel de referência com
  // prev/next): reativa a etapa anterior, reiniciando o timer dela.
  document.addEventListener('click', function (e) {
    const backBtn = e.target.closest('.db-step-back-btn');
    if (!backBtn || editMode) return;
    const sessionId = lastSnapshot && lastSnapshot.active_session_id;
    if (!sessionId) return;
    backBtn.disabled = true;
    fetch(widgetIdUrl(goBackStepUrlTemplate, sessionId), { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) alert(data.error || 'Não foi possível voltar.');
        refresh();
      })
      .finally(function () { backBtn.disabled = false; });
  });

  function postSetValue(widgetId, value, roleKey) {
    fetch(widgetIdUrl(setValueUrlTemplate, widgetId), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: value, role_key: roleKey || null }),
    }).then(function () { refresh(); });
  }

  function renderWidget(el, data) {
    const type = el.dataset.widgetType;
    if (type === 'vessel') {
      renderVessel(el, data);
    } else if (type === 'toggle') {
      const config = JSON.parse(el.dataset.configJson || '{}');
      const manualEnabled = config.manual_control_enabled !== false;
      const state = data ? data.value : null;
      el.querySelector('.db-toggle-state').textContent = fmtValue(state) + (manualEnabled ? '' : ' \uD83D\uDD12');
      el.classList.toggle('btn-success', !!state);
      el.classList.toggle('btn-outline-light', !state);
      el.disabled = !manualEnabled;
      el.title = manualEnabled ? '' : 'Acionamento manual desativado nas Configurações deste widget';
    } else if (type === 'gauge') {
      const v = data ? data.value : null;
      const min = (data && data.min_value) || 0;
      const max = (data && data.max_value) || 100;
      const pct = (v === null || v === undefined) ? 0 : Math.max(0, Math.min(100, ((v - min) / (max - min || 1)) * 100));
      el.querySelector('.db-gauge-bar').style.width = pct + '%';
      el.querySelector('.db-gauge-value').textContent = fmtValue(v, 1) + (data && data.unit ? data.unit : '');
    } else if (type === 'digital') {
      el.querySelector('.db-digital-value').textContent = fmtValue(data ? data.value : null, 1) + (data && data.unit ? data.unit : '');
    } else if (type === 'alarm_list') {
      const list = el.querySelector('.db-alarm-list');
      list.innerHTML = '';
      const fired = (data && data.fired) || [];
      const upcoming = (data && data.upcoming) || [];

      fired.forEach(function (a) {
        const li = document.createElement('li');
        li.className = 'mb-1';
        li.innerHTML = '<span class="badge bg-' + (a.severity === 'critical' || a.severity === 'high' ? 'danger' : 'warning') + '">' + a.severity + '</span> ' + a.message;
        list.appendChild(li);
      });

      upcoming.forEach(function (u) {
        const li = document.createElement('li');
        li.className = 'mb-1 text-muted';
        let timeLabel;
        if (u.seconds_until === null || u.seconds_until === undefined) {
          timeLabel = 'agendado';
        } else if (u.seconds_until <= 0) {
          timeLabel = 'agora';
        } else {
          const mins = Math.ceil(u.seconds_until / 60);
          timeLabel = 'em ' + mins + ' min';
        }
        li.innerHTML = '<span class="badge bg-secondary">' + timeLabel + '</span> ' + u.name;
        list.appendChild(li);
      });

      if (!list.children.length) {
        const statusHint = (data && data.session_status) ? '' : ' (nenhuma Sessão associada a esta Planta ainda)';
        list.innerHTML = '<li class="text-muted">Sem alarmes ativos ou agendados' + statusHint + '.</li>';
      }
    } else if (type === 'step_card') {
      const current = data && data.current;
      const next = data && data.next;
      const emptyEl = el.querySelector('.db-step-empty');
      const currentBox = el.querySelector('.db-step-current');
      if (!current) {
        emptyEl.classList.remove('d-none');
        currentBox.classList.add('d-none');
        return;
      }
      emptyEl.classList.add('d-none');
      currentBox.classList.remove('d-none');
      const typeLabel = current.step_type === 'boil' ? 'Fervura' : 'Mostura';
      const tempLabel = (current.target_temp === null || current.target_temp === undefined) ? '' : (current.target_temp + '°C');
      el.querySelector('.db-step-current-name').textContent = current.name;
      el.querySelector('.db-step-current-meta').textContent = typeLabel + (tempLabel ? ' — ' + tempLabel : '');

      el.querySelector('.db-step-countdown').textContent = fmtCountdown(current.remaining_seconds);

      // Rampa (subida até o alvo) some quando termina — decisão da
      // conversa; barra de hold assume a partir daí.
      const rampWrap = el.querySelector('.db-step-ramp-wrap');
      const hasRamp = !!current.ramp_seconds;
      rampWrap.classList.toggle('d-none', !hasRamp || current.phase !== 'ramp');
      el.querySelector('.db-step-ramp-bar').style.width = (current.ramp_progress_pct || 0) + '%';

      const holdPct = current.hold_progress_pct || 0;
      const holdBar = el.querySelector('.db-step-hold-bar');
      holdBar.style.width = holdPct + '%';
      holdBar.classList.toggle('bg-info', current.phase !== 'hold' || holdPct < 100);
      holdBar.classList.toggle('bg-success', current.phase === 'hold' && holdPct >= 100);

      el.querySelector('.db-step-next-name').textContent = next ? next.name : '—';

      // Botão "Avançar" sempre habilitado — só ganha destaque visual
      // (sólido) quando o timer sugere que já deu tempo (decisão
      // híbrida da conversa). "Voltar" reaproveita o mesmo destaque
      // discreto, sempre disponível (mesmo padrão do painel de
      // referência anexado na conversa: prev/next sempre visíveis).
      const finished = current.phase === 'hold' && holdPct >= 100;
      const advanceBtn = el.querySelector('.db-step-advance-btn');
      advanceBtn.classList.toggle('btn-outline-success', !finished);
      advanceBtn.classList.toggle('btn-success', finished);
    }
  }

  function fmtCountdown(totalSeconds) {
    if (totalSeconds === null || totalSeconds === undefined) return '—:—';
    const s = Math.max(0, Math.round(totalSeconds));
    const mm = Math.floor(s / 60);
    const ss = s % 60;
    return mm + ':' + String(ss).padStart(2, '0');
  }

  function vesselEl(vesselId) {
    return document.querySelector('.db-widget[data-vessel-id="' + vesselId + '"]');
  }

  // Posição absoluta (px, relativa ao canvas) de uma âncora — rx/ry são
  // frações (0–1) da caixa do widget do tanque, por isso a âncora
  // acompanha o widget se ele for movido/redimensionado (skill n/a —
  // é dado de UI, não schema).
  function anchorAbsPos(vesselId, anchor) {
    const el = vesselEl(vesselId);
    if (!el) return null;
    const a = anchor || { rx: 0.5, ry: 1.0 };
    return {
      x: el.offsetLeft + (a.rx != null ? a.rx : 0.5) * el.offsetWidth,
      y: el.offsetTop + (a.ry != null ? a.ry : 1.0) * el.offsetHeight,
    };
  }

  // Converte um ponto absoluto (px) numa fração rx/ry clampada à borda
  // da caixa do tanque — usado ao arrastar a âncora (âncora livre,
  // clique/arrasto em qualquer ponto da borda).
  function pointToClampedAnchor(vesselId, absX, absY) {
    const el = vesselEl(vesselId);
    if (!el) return { rx: 0.5, ry: 1.0 };
    const rx = Math.min(Math.max((absX - el.offsetLeft) / el.offsetWidth, 0), 1);
    const ry = Math.min(Math.max((absY - el.offsetTop) / el.offsetHeight, 0), 1);
    return { rx: rx, ry: ry };
  }

  function pipePointsFor(conn) {
    const p0 = anchorAbsPos(conn.from_vessel_id, conn.from_anchor);
    const p1 = anchorAbsPos(conn.to_vessel_id, conn.to_anchor);
    if (!p0 || !p1) return null;
    return [p0].concat(conn.waypoints || []).concat([p1]);
  }

  function renderPipes(connections) {
    pipesState = connections || [];
    const svg = document.getElementById('dbPipesLayer');
    svg.innerHTML = '';
    svg.style.pointerEvents = editMode ? 'auto' : 'none';
    // Achado real (conversa): self-loop (origem == destino) desenha a
    // linha atrás do próprio widget (z-index do widget é maior) —
    // fica inclicável. Levanta a camada SVG acima dos widgets só
    // enquanto uma tubulação está selecionada, pra linha/alças ficarem
    // sempre acessíveis.
    svg.style.zIndex = (editMode && selectedPipeIndex !== null) ? '500' : '1';

    pipesState.forEach(function (conn, idx) {
      const points = pipePointsFor(conn);
      if (!points) return;

      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      poly.setAttribute('points', points.map(function (p) { return p.x + ',' + p.y; }).join(' '));
      poly.setAttribute('fill', 'none');
      poly.setAttribute('stroke', conn.flowing ? conn.color : '#555');
      poly.setAttribute('stroke-width', String(conn.width || 6));
      poly.setAttribute('stroke-dasharray', conn.flowing ? '10,6' : 'none');
      poly.setAttribute('pointer-events', editMode ? 'stroke' : 'none');
      poly.style.cursor = editMode ? 'pointer' : 'default';
      if (conn.flowing) poly.style.animation = 'db-flow 1s linear infinite';
      poly.addEventListener('mousedown', function (e) {
        if (!editMode) return;
        e.stopPropagation();
        selectedPipeIndex = idx;
        selectedWaypointIndex = null;
        renderPipes(pipesState);
      });
      svg.appendChild(poly);

      if (editMode && selectedPipeIndex === idx) {
        renderPipeHandles(svg, idx, points);
      }
    });
  }

  function makeHandleCircle(x, y, r, fill) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
    c.setAttribute('fill', fill);
    c.setAttribute('stroke', '#fff');
    c.setAttribute('stroke-width', 1.5);
    c.setAttribute('pointer-events', 'all');
    c.style.cursor = 'grab';
    return c;
  }

  // Alças de edição de geometria da conexão selecionada: âncoras
  // (verde, extremos, arrasto restrito à borda do tanque),
  // waypoints já existentes (azul/vermelho se selecionado, arrasto
  // livre, clique seleciona pra permitir apagar com Delete), e um
  // "fantasma" no meio de cada segmento (arrastar cria waypoint novo
  // ali — combinamos essa interação na conversa).
  function renderPipeHandles(svg, pipeIdx, points) {
    for (let i = 0; i < points.length - 1; i++) {
      const mx = (points[i].x + points[i + 1].x) / 2;
      const my = (points[i].y + points[i + 1].y) / 2;
      const ghost = makeHandleCircle(mx, my, 5, 'rgba(255,255,255,0.5)');
      ghost.style.cursor = 'copy';
      ghost.addEventListener('mousedown', function (e) {
        e.stopPropagation();
        e.preventDefault();
        const waypointIndex = i; // novo waypoint entra na posição i da lista de waypoints
        pipeDragState = { pipeIndex: pipeIdx, kind: 'new-waypoint', waypointIndex: waypointIndex, created: false };
      });
      svg.appendChild(ghost);
    }

    (pipesState[pipeIdx].waypoints || []).forEach(function (wp, wpIdx) {
      const isSelected = selectedWaypointIndex === wpIdx;
      const c = makeHandleCircle(wp.x, wp.y, 6, isSelected ? '#e74c3c' : '#3498db');
      c.addEventListener('mousedown', function (e) {
        e.stopPropagation();
        e.preventDefault();
        selectedWaypointIndex = wpIdx;
        pipeDragState = { pipeIndex: pipeIdx, kind: 'waypoint', waypointIndex: wpIdx };
        renderPipes(pipesState);
      });
      svg.appendChild(c);
    });

    [{ side: 'from', vesselId: pipesState[pipeIdx].from_vessel_id, p: points[0] },
     { side: 'to', vesselId: pipesState[pipeIdx].to_vessel_id, p: points[points.length - 1] }]
      .forEach(function (anchorInfo) {
        const c = makeHandleCircle(anchorInfo.p.x, anchorInfo.p.y, 7, '#2ecc71');
        c.addEventListener('mousedown', function (e) {
          e.stopPropagation();
          e.preventDefault();
          pipeDragState = { pipeIndex: pipeIdx, kind: 'anchor', side: anchorInfo.side, vesselId: anchorInfo.vesselId };
        });
        svg.appendChild(c);
      });
  }

  function svgPointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function persistPipesGeometry() {
    fetch(connectionsUrl, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ connections: pipesState }),
    });
  }

  function removeSelectedWaypoint() {
    if (selectedPipeIndex === null || selectedWaypointIndex === null) return;
    const conn = pipesState[selectedPipeIndex];
    if (!conn || !conn.waypoints) return;
    conn.waypoints.splice(selectedWaypointIndex, 1);
    selectedWaypointIndex = null;
    persistPipesGeometry();
    renderPipes(pipesState);
  }

  let sessionOverride = null;

  function refresh() {
    const url = sessionOverride ? (snapshotUrl + '?session_id=' + sessionOverride) : snapshotUrl;
    fetch(url).then(function (r) { return r.json(); }).then(function (data) {
      lastSnapshot = data;
      Object.keys(data.widgets || {}).forEach(function (widgetId) {
        const el = document.getElementById('db-widget-' + widgetId);
        if (el) renderWidget(el, data.widgets[widgetId]);
      });
      if (!pipeDragState) renderPipes(data.connections || []);
      if (data.active_session_id) initCharts(data.active_session_id);
      populateSessionSelector(data.available_sessions || [], data.active_session_id);
    }).catch(function (e) { console.warn('snapshot falhou', e); });
  }

  // Seletor de sessão (conversa — "selecionar sessão ativa de forma mais
  // dinâmica"): dropdown alimentado pelo próprio snapshot, sem round-trip
  // extra. Preserva a seleção manual do usuário entre polls — só
  // reconstrói as <option> se a lista de sessões mudou de verdade.
  let lastSessionOptionsKey = null;
  function populateSessionSelector(sessions, autoDetectedId) {
    const sel = document.getElementById('dbSessionSelector');
    if (!sel) return;
    const key = sessions.map(function (s) { return s.id + ':' + s.status; }).join(',');
    if (key === lastSessionOptionsKey) return;
    lastSessionOptionsKey = key;
    const currentValue = sel.value;
    sel.innerHTML = '<option value="">Detecção automática' + (autoDetectedId ? ' (#' + autoDetectedId + ')' : '') + '</option>';
    sessions.forEach(function (s) {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = '#' + s.id + ' — ' + s.name + ' (' + s.status + ')';
      sel.appendChild(opt);
    });
    sel.value = currentValue; // restaura seleção manual, se ainda existir na lista
  }

  const sessionSelectorEl = document.getElementById('dbSessionSelector');
  if (sessionSelectorEl) {
    sessionSelectorEl.addEventListener('change', function () {
      sessionOverride = sessionSelectorEl.value || null;
      refresh();
    });
  }

  function initCharts(fallbackSessionId) {
    document.querySelectorAll('.db-chart').forEach(function (canvas) {
      if (canvas.dataset.inited) return;
      const sessionId = canvas.dataset.sessionId || fallbackSessionId;
      if (!sessionId) return;
      canvas.dataset.inited = '1';
      const readingsUrl = widgetIdUrl(readingsUrlTemplate, sessionId);
      const url = readingsUrl + '?function_name=' + encodeURIComponent(canvas.dataset.functionName) + '&window_minutes=' + canvas.dataset.windowMinutes;

      function loadChart() {
        fetch(url).then(function (r) { return r.json(); }).then(function (data) {
          const labels = (data.points || []).map(function (p) { return p.t.slice(11, 16); });
          const values = (data.points || []).map(function (p) { return p.v; });
          if (charts[canvas.id] || !canvas.id) {
            canvas.id = canvas.id || ('db-chart-' + Math.random().toString(36).slice(2));
          }
          if (charts[canvas.id]) {
            charts[canvas.id].data.labels = labels;
            charts[canvas.id].data.datasets[0].data = values;
            charts[canvas.id].update();
          } else {
            charts[canvas.id] = new Chart(canvas, {
              type: 'line',
              data: { labels: labels, datasets: [{ data: values, borderColor: '#f0932b', tension: 0.3 }] },
              options: { plugins: { legend: { display: false } }, animation: false },
            });
          }
        });
      }
      loadChart();
      setInterval(loadChart, 15000);
    });
  }

  // ── Modo Edição: arrastar, redimensionar, botão direito ────────────────

  const canvas = document.getElementById('dbCanvas');
  const editToggle = document.getElementById('dbEditToggle');
  const editToolbar = document.getElementById('dbEditToolbar');
  const editModeStorageKey = 'db-editmode-' + layoutId;

  function applyEditMode(value) {
    editMode = value;
    canvas.classList.toggle('db-edit-mode', editMode);
    editToolbar.classList.toggle('d-none', !editMode);
    palette.classList.toggle('d-none', !editMode);
    editToggle.innerHTML = editMode
      ? '<i class="bi bi-unlock-fill"></i> Sair do Modo Edição'
      : '<i class="bi bi-unlock"></i> Modo Edição';
    editToggle.classList.toggle('btn-warning', editMode);
    editToggle.classList.toggle('btn-outline-warning', !editMode);
    document.querySelectorAll('.db-resize-handle').forEach(function (h) { h.classList.toggle('d-none', !editMode); });
    if (!editMode) {
      selectedPipeIndex = null;
      selectedWaypointIndex = null;
      deselectWidget();
      pipeDragState = null;
    }
    renderPipes(pipesState);
    try { sessionStorage.setItem(editModeStorageKey, editMode ? '1' : '0'); } catch (e) { /* modo privado etc — ignora */ }
  }

  editToggle.addEventListener('click', function () { applyEditMode(!editMode); });

  // Clicar em área vazia do canvas desseleciona a tubulação em edição
  // (as alças só aparecem pra conexão selecionada — seção "Editor de
  // tubulação CAD-like").
  canvas.addEventListener('mousedown', function (e) {
    if (!editMode) return;
    if (e.target.closest('.db-widget') || e.target.closest('svg#dbPipesLayer')) return;
    if (selectedPipeIndex !== null) {
      selectedPipeIndex = null;
      selectedWaypointIndex = null;
      renderPipes(pipesState);
    }
    deselectWidget();
  });

  document.addEventListener('keydown', function (e) {
    if (!editMode) return;
    if (e.key !== 'Delete' && e.key !== 'Backspace') return;
    if (e.target.closest('input, select, textarea')) return; // não intercepta digitação normal
    if (selectedWaypointIndex !== null) {
      e.preventDefault();
      removeSelectedWaypoint();
    }
  });

  // Arrastar
  let dragState = null;
  canvas.addEventListener('mousedown', function (e) {
    if (!editMode) return;
    const widgetEl = e.target.closest('.db-widget');
    if (!widgetEl || e.target.classList.contains('db-resize-handle')) return;
    if (e.target.closest('.db-no-drag')) return; // só os botões utilitários (Gerenciar Etapas, Avançar, Voltar) — não o widget Botão em si
    dragState = {
      el: widgetEl, startX: e.clientX, startY: e.clientY,
      origLeft: widgetEl.offsetLeft, origTop: widgetEl.offsetTop, moved: false,
    };
    e.preventDefault();
  });

  let resizeState = null;
  document.addEventListener('mousedown', function (e) {
    if (!editMode || !e.target.classList.contains('db-resize-handle')) return;
    const widgetEl = e.target.closest('.db-widget');
    resizeState = {
      el: widgetEl, startX: e.clientX, startY: e.clientY,
      origWidth: widgetEl.offsetWidth, origHeight: widgetEl.offsetHeight,
    };
    e.preventDefault();
  });

  document.addEventListener('mousemove', function (e) {
    if (dragState) {
      const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragState.moved = true;
      dragState.el.style.left = (dragState.origLeft + dx) + 'px';
      dragState.el.style.top = (dragState.origTop + dy) + 'px';
    }
    if (resizeState) {
      const dx = e.clientX - resizeState.startX, dy = e.clientY - resizeState.startY;
      resizeState.el.style.width = Math.max(60, resizeState.origWidth + dx) + 'px';
      resizeState.el.style.height = Math.max(60, resizeState.origHeight + dy) + 'px';
    }
    if (pipeDragState) {
      const pt = svgPointFromEvent(e);
      const conn = pipesState[pipeDragState.pipeIndex];
      if (!conn) { pipeDragState = null; return; }
      if (pipeDragState.kind === 'anchor') {
        const anchor = pointToClampedAnchor(pipeDragState.vesselId, pt.x, pt.y);
        if (pipeDragState.side === 'from') conn.from_anchor = anchor; else conn.to_anchor = anchor;
      } else if (pipeDragState.kind === 'waypoint') {
        conn.waypoints[pipeDragState.waypointIndex] = pt;
      } else if (pipeDragState.kind === 'new-waypoint') {
        if (!pipeDragState.created) {
          conn.waypoints = conn.waypoints || [];
          conn.waypoints.splice(pipeDragState.waypointIndex, 0, pt);
          pipeDragState.created = true;
          pipeDragState.kind = 'waypoint';
          selectedWaypointIndex = pipeDragState.waypointIndex;
        } else {
          conn.waypoints[pipeDragState.waypointIndex] = pt;
        }
      }
      renderPipes(pipesState);
    }
  });

  document.addEventListener('mouseup', function () {
    if (dragState) {
      const el = dragState.el;
      if (dragState.moved) {
        fetch(widgetIdUrl(geometryUrlTemplate, el.dataset.widgetId), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ x: el.offsetLeft, y: el.offsetTop }),
        });
      } else {
        selectWidget(el);
      }
      dragState = null;
    }
    if (resizeState) {
      const el = resizeState.el;
      fetch(widgetIdUrl(geometryUrlTemplate, el.dataset.widgetId), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ width: el.offsetWidth, height: el.offsetHeight }),
      });
      resizeState = null;
    }
    if (pipeDragState) {
      if (pipeDragState.kind !== 'new-waypoint' || pipeDragState.created) {
        persistPipesGeometry();
      }
      pipeDragState = null;
    }
  });

  // ── Paleta de widgets (conversa — Ponto 3) ──────────────────────────────
  // Arrastar um ícone da paleta pro canvas cria um widget SOLTO (sem
  // vessel_id/device_function_name) na posição exata do drop — sem
  // formulário/tela de cadastro no meio do caminho. O painel lateral
  // (abaixo) é quem faz a configuração/vínculo depois.
  const palette = document.getElementById('dbPalette');
  let paletteDragType = null;
  let paletteGhost = null;

  document.querySelectorAll('.db-palette-item').forEach(function (item) {
    item.addEventListener('mousedown', function (e) {
      if (!editMode) return;
      e.preventDefault();
      paletteDragType = item.dataset.widgetType;
      paletteGhost = item.cloneNode(true);
      paletteGhost.style.position = 'fixed';
      paletteGhost.style.opacity = '0.7';
      paletteGhost.style.pointerEvents = 'none';
      paletteGhost.style.width = '80px';
      paletteGhost.style.zIndex = '3000';
      paletteGhost.style.left = e.clientX + 'px';
      paletteGhost.style.top = e.clientY + 'px';
      document.body.appendChild(paletteGhost);
    });
  });

  document.addEventListener('mousemove', function (e) {
    if (paletteGhost) {
      paletteGhost.style.left = (e.clientX - 30) + 'px';
      paletteGhost.style.top = (e.clientY - 20) + 'px';
    }
  });

  document.addEventListener('mouseup', function (e) {
    if (!paletteDragType) return;
    const rect = canvas.getBoundingClientRect();
    const insideCanvas = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
    if (insideCanvas) {
      createWidgetFromPalette(paletteDragType, e.clientX - rect.left - 40, e.clientY - rect.top - 40);
    }
    if (paletteGhost) { paletteGhost.remove(); paletteGhost = null; }
    paletteDragType = null;
  });

  function createWidgetFromPalette(widgetType, x, y) {
    const payload = {
      widget_type: widgetType, label_text: '', x: Math.max(0, Math.round(x)), y: Math.max(0, Math.round(y)),
      width: 180, height: 180,
    };
    fetch(createWidgetUrl, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data.ok) { window.location.reload(); } else { alert(data.error || 'Erro ao criar widget.'); }
    });
  }

  // ── Painel lateral (conversa — Ponto 3) ─────────────────────────────────
  // Substitui o antigo menu de contexto + modal de Configurações por
  // completo: clicar (sem arrastar) um widget em modo edição seleciona
  // e abre o painel; clicar em área vazia fecha.
  const sidePanel = document.getElementById('dbSidePanel');
  let selectedWidgetEl = null;

  const panelFieldsByType = {
    vessel: ['vessel_ref', 'svg_shape', 'fill_role_key', 'manual_control_enabled'],
    toggle: ['function_ref', 'icon_picker', 'confirm_before_actuate', 'manual_control_enabled'],
    gauge: ['function_ref', 'min_max'],
    digital: ['function_ref', 'decimal_places'],
    chart: ['function_ref', 'session_window'],
    alarm_list: [],
    step_card: [],
    text: ['content'],
    image: ['image_url'],
  };

  function selectWidget(el) {
    selectedWidgetEl = el;
    const type = el.dataset.widgetType;
    const config = JSON.parse(el.dataset.configJson || '{}');
    document.getElementById('dbPanelTitle').textContent = (el.dataset.labelText || type);
    document.getElementById('dbPanelWidgetId').value = el.dataset.widgetId;
    document.getElementById('dbPanelLabel').value = el.dataset.labelText || '';
    document.getElementById('dbPanelVessel').value = el.dataset.vesselId || '';
    document.getElementById('dbPanelFunction').value = el.dataset.deviceFunctionName || '';
    document.getElementById('dbPanelSvgShape').value = config.svg_shape || 'mash_tun';
    document.getElementById('dbPanelFillRoleKey').value = config.fill_role_key || '';
    document.getElementById('dbPanelMin').value = config.min !== undefined ? config.min : '';
    document.getElementById('dbPanelMax').value = config.max !== undefined ? config.max : '';
    document.getElementById('dbPanelDecimalPlaces').value = config.decimal_places !== undefined ? config.decimal_places : 1;
    document.getElementById('dbPanelSessionId').value = config.session_id || '';
    document.getElementById('dbPanelWindowMinutes').value = config.window_minutes || 60;
    document.getElementById('dbPanelContent').value = config.content || '';
    document.getElementById('dbPanelImageUrl').value = config.image_url || '';
    document.getElementById('dbPanelConfirm').checked = !!config.confirm_before_actuate;
    document.getElementById('dbPanelManualControl').checked = config.manual_control_enabled !== false;
    document.getElementById('dbPanelIcon').value = config.icon || 'bi-power';
    document.querySelectorAll('.db-panel-icon-option').forEach(function (btn) {
      btn.classList.toggle('btn-light', btn.dataset.icon === (config.icon || 'bi-power'));
      btn.classList.toggle('btn-outline-light', btn.dataset.icon !== (config.icon || 'bi-power'));
    });
    document.getElementById('dbPanelFontSize').value = config.font_size || 16;
    document.getElementById('dbPanelColor').value = config.color || '#e9ecef';
    document.getElementById('dbPanelFontFamily').value = config.font_family || '';
    document.getElementById('dbPanelBold').classList.toggle('btn-light', !!config.bold);
    document.getElementById('dbPanelBold').classList.toggle('btn-outline-light', !config.bold);
    document.getElementById('dbPanelBold').dataset.active = config.bold ? '1' : '0';
    document.getElementById('dbPanelItalic').classList.toggle('btn-light', !!config.italic);
    document.getElementById('dbPanelItalic').classList.toggle('btn-outline-light', !config.italic);
    document.getElementById('dbPanelItalic').dataset.active = config.italic ? '1' : '0';

    const visibleFields = panelFieldsByType[type] || [];
    document.querySelectorAll('.db-panel-field').forEach(function (field) {
      field.classList.toggle('d-none', visibleFields.indexOf(field.dataset.field) === -1);
    });
    sidePanel.classList.remove('d-none');
  }

  function deselectWidget() {
    selectedWidgetEl = null;
    sidePanel.classList.add('d-none');
  }

  document.getElementById('dbPanelCloseBtn').addEventListener('click', deselectWidget);

  document.querySelectorAll('.db-panel-icon-option').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.getElementById('dbPanelIcon').value = btn.dataset.icon;
      document.querySelectorAll('.db-panel-icon-option').forEach(function (b) {
        b.classList.toggle('btn-light', b === btn);
        b.classList.toggle('btn-outline-light', b !== btn);
      });
    });
  });

  document.getElementById('dbPanelBold').addEventListener('click', function () {
    const active = this.dataset.active === '1';
    this.dataset.active = active ? '0' : '1';
    this.classList.toggle('btn-light', !active);
    this.classList.toggle('btn-outline-light', active);
  });
  document.getElementById('dbPanelItalic').addEventListener('click', function () {
    const active = this.dataset.active === '1';
    this.dataset.active = active ? '0' : '1';
    this.classList.toggle('btn-light', !active);
    this.classList.toggle('btn-outline-light', active);
  });

  // Upload de imagem (conversa): clicar no botão abre o seletor de
  // arquivo do sistema; ao escolher, envia pro servidor e a URL
  // devolvida preenche o campo sozinha.
  document.getElementById('dbPanelImagePickBtn').addEventListener('click', function () {
    document.getElementById('dbPanelImageFile').click();
  });
  document.getElementById('dbPanelImageFile').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const uploadingEl = document.getElementById('dbPanelImageUploading');
    uploadingEl.classList.remove('d-none');
    const formData = new FormData();
    formData.append('image', file);
    fetch(uploadImageUrl, { method: 'POST', body: formData })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        uploadingEl.classList.add('d-none');
        if (data.ok) {
          document.getElementById('dbPanelImageUrl').value = data.url;
        } else {
          alert(data.error || 'Erro ao enviar imagem.');
        }
      })
      .catch(function () {
        uploadingEl.classList.add('d-none');
        alert('Erro ao enviar imagem.');
      });
  });

  document.getElementById('dbPanelSaveBtn').addEventListener('click', function () {
    if (!selectedWidgetEl) return;
    const widgetId = document.getElementById('dbPanelWidgetId').value;
    const type = selectedWidgetEl.dataset.widgetType;
    const configJson = {};
    if (type === 'vessel') {
      configJson.svg_shape = document.getElementById('dbPanelSvgShape').value;
      configJson.fill_role_key = document.getElementById('dbPanelFillRoleKey').value || null;
      configJson.manual_control_enabled = document.getElementById('dbPanelManualControl').checked;
    } else if (type === 'toggle') {
      configJson.confirm_before_actuate = document.getElementById('dbPanelConfirm').checked;
      configJson.manual_control_enabled = document.getElementById('dbPanelManualControl').checked;
      configJson.icon = document.getElementById('dbPanelIcon').value || 'bi-power';
    } else if (type === 'gauge') {
      configJson.min = parseFloat(document.getElementById('dbPanelMin').value) || 0;
      configJson.max = parseFloat(document.getElementById('dbPanelMax').value) || 100;
    } else if (type === 'digital') {
      configJson.decimal_places = parseInt(document.getElementById('dbPanelDecimalPlaces').value, 10) || 0;
    } else if (type === 'chart') {
      configJson.session_id = parseInt(document.getElementById('dbPanelSessionId').value, 10) || null;
      configJson.window_minutes = parseInt(document.getElementById('dbPanelWindowMinutes').value, 10) || 60;
    } else if (type === 'text') {
      configJson.content = document.getElementById('dbPanelContent').value || null;
      configJson.font_size = parseInt(document.getElementById('dbPanelFontSize').value, 10) || 16;
      configJson.color = document.getElementById('dbPanelColor').value || '#e9ecef';
      configJson.font_family = document.getElementById('dbPanelFontFamily').value || null;
      configJson.bold = document.getElementById('dbPanelBold').dataset.active === '1';
      configJson.italic = document.getElementById('dbPanelItalic').dataset.active === '1';
    } else if (type === 'image') {
      configJson.image_url = document.getElementById('dbPanelImageUrl').value || null;
    }

    const payload = { label_text: document.getElementById('dbPanelLabel').value, config_json: configJson };
    if (type === 'vessel') {
      payload.vessel_id = parseInt(document.getElementById('dbPanelVessel').value, 10) || null;
    } else if (['toggle', 'gauge', 'digital', 'chart'].indexOf(type) !== -1) {
      payload.device_function_name = document.getElementById('dbPanelFunction').value || null;
    }

    fetch(widgetIdUrl(configUrlTemplate, widgetId), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    }).then(function () { window.location.reload(); });
  });

  document.getElementById('dbPanelRemoveBtn').addEventListener('click', function () {
    if (!selectedWidgetEl) return;
    if (!confirm('Remover este widget do dashboard?')) return;
    fetch(widgetIdUrl(deleteUrlTemplate, selectedWidgetEl.dataset.widgetId), { method: 'POST' })
      .then(function () { selectedWidgetEl.remove(); deselectWidget(); });
  });

  {% if layout.plant_id %}
  // Modal de Tubulação
  const pipesModal = new bootstrap.Modal(document.getElementById('dbPipesModal'));
  const vesselOptions = [
    {% for vid, v in vessels_by_id.items() %}
    { id: {{ vid }}, label: {{ v.label_text | tojson }} },
    {% endfor %}
  ];
  const actuatorFunctionOptions = [
    {% for f in actuator_functions %}
    { name: {{ f.name | tojson }}, label: {{ (f.display_name or f.name) | tojson }} },
    {% endfor %}
  ];

  function pipeRowHtml(conn) {
    conn = conn || {};
    const opts = vesselOptions.map(function (v) {
      return '<option value="' + v.id + '">' + v.label + '</option>';
    }).join('');
    const functionOpts = '<option value="">—</option>' + actuatorFunctionOptions.map(function (f) {
      return '<option value="' + f.name + '">' + f.label + '</option>';
    }).join('');
    return '<div class="row g-2 mb-2 db-pipe-row align-items-end">' +
      '<div class="col-3"><label class="form-label small">De</label><select class="form-select form-select-sm db-pipe-from">' + opts + '</select></div>' +
      '<div class="col-3"><label class="form-label small">Para</label><select class="form-select form-select-sm db-pipe-to">' + opts + '</select></div>' +
      '<div class="col-2"><label class="form-label small">Atuador de fluxo</label><select class="form-select form-select-sm db-pipe-function">' + functionOpts + '</select></div>' +
      '<div class="col-2"><label class="form-label small">Cor</label><input type="color" class="form-control form-control-sm form-control-color db-pipe-color" value="' + (conn.color || '#3498db') + '"></div>' +
      '<div class="col-1"><label class="form-label small">Esp.</label><input type="number" class="form-control form-control-sm db-pipe-width" value="' + (conn.width || 6) + '"></div>' +
      '<div class="col-1"><button type="button" class="btn btn-sm btn-outline-danger db-pipe-remove"><i class="bi bi-x"></i></button></div>' +
      '</div>';
  }

  function addPipeRow(conn) {
    const wrap = document.createElement('div');
    wrap.innerHTML = pipeRowHtml(conn);
    const row = wrap.firstElementChild;
    if (conn && conn.from_vessel_id) row.querySelector('.db-pipe-from').value = conn.from_vessel_id;
    if (conn && conn.to_vessel_id) row.querySelector('.db-pipe-to').value = conn.to_vessel_id;
    if (conn && conn.flow_function_name) row.querySelector('.db-pipe-function').value = conn.flow_function_name;
    // Geometria (from_anchor/to_anchor/waypoints) editada no canvas viaja
    // junto da linha — o modal só edita identidade/estilo, nunca mexe
    // nisso, mas precisa devolver intacto no Salvar (conversa — editor
    // CAD-like). Linha nova (conn == null) não carrega geometria; o
    // backend aplica âncora padrão nesse caso.
    if (conn) {
      row.dataset.geometry = JSON.stringify({
        from_anchor: conn.from_anchor, to_anchor: conn.to_anchor, waypoints: conn.waypoints,
      });
    }
    row.querySelector('.db-pipe-remove').addEventListener('click', function () { row.remove(); });
    document.getElementById('dbPipesRows').appendChild(row);
  }

  document.getElementById('dbEditPipesBtn').addEventListener('click', function () {
    document.getElementById('dbPipesRows').innerHTML = '';
    const existing = (lastSnapshot && lastSnapshot.connections) || [];
    if (existing.length) {
      existing.forEach(function (c) { addPipeRow(c); });
    } else {
      addPipeRow(null);
    }
    pipesModal.show();
  });
  document.getElementById('dbPipesAddRowBtn').addEventListener('click', function () { addPipeRow(null); });

  // Self-loop (origem == destino, ex.: recirculação na própria panela)
  // sem geometria salva ainda: gera uma alcinha padrão pra fora do
  // tanque — sem isso a conexão nasce com a linha inteira atrás do
  // próprio widget, achado real da conversa.
  function defaultSelfLoopGeometry(vesselId) {
    const el = vesselEl(vesselId);
    if (!el) return null;
    return {
      from_anchor: { rx: 1.0, ry: 0.35 },
      to_anchor: { rx: 1.0, ry: 0.65 },
      waypoints: [{ x: el.offsetLeft + el.offsetWidth + 40, y: el.offsetTop + el.offsetHeight * 0.5 }],
    };
  }

  document.getElementById('dbPipesSaveBtn').addEventListener('click', function () {
    const connections = Array.from(document.querySelectorAll('.db-pipe-row')).map(function (row) {
      const fromId = parseInt(row.querySelector('.db-pipe-from').value, 10);
      const toId = parseInt(row.querySelector('.db-pipe-to').value, 10);
      const base = {
        from_vessel_id: fromId,
        to_vessel_id: toId,
        flow_function_name: row.querySelector('.db-pipe-function').value || null,
        color: row.querySelector('.db-pipe-color').value,
        width: parseInt(row.querySelector('.db-pipe-width').value, 10) || 6,
      };
      if (row.dataset.geometry) {
        Object.assign(base, JSON.parse(row.dataset.geometry));
      } else if (fromId === toId) {
        const loop = defaultSelfLoopGeometry(fromId);
        if (loop) Object.assign(base, loop);
      }
      return base;
    });
    fetch(connectionsUrl, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ connections: connections }),
    }).then(function () { pipesModal.hide(); refresh(); });
  });
  {% endif %}

  // ── Modal: Gerenciar Etapas (conversa — Ponto 2) ────────────────────────
  const stepsModal = new bootstrap.Modal(document.getElementById('dbStepsModal'));
  const stepTypeFieldsMap = {
    mash: ['temperatura', 'tempo_min', 'ramp_time_min'],
    boil: ['temperatura', 'tempo_min'],
    alert: ['trigger_minutes_remaining'],
  };

  function syncStepFormFields() {
    const type = document.getElementById('dbStepFormType').value;
    const visible = stepTypeFieldsMap[type] || [];
    document.querySelectorAll('.db-step-field').forEach(function (field) {
      field.classList.toggle('d-none', visible.indexOf(field.dataset.field) === -1);
    });
  }
  document.getElementById('dbStepFormType').addEventListener('change', syncStepFormFields);

  function resetStepForm() {
    document.getElementById('dbStepForm').reset();
    document.getElementById('dbStepFormId').value = '';
    document.getElementById('dbStepFormTitle').textContent = 'Adicionar Etapa';
    document.getElementById('dbStepFormSaveBtn').innerHTML = '<i class="bi bi-plus-lg"></i> Adicionar';
    document.getElementById('dbStepFormCancelBtn').classList.add('d-none');
    syncStepFormFields();
  }
  document.getElementById('dbStepFormCancelBtn').addEventListener('click', resetStepForm);

  function loadStepsList() {
    const recipeId = lastSnapshot && lastSnapshot.active_recipe_id;
    const tbody = document.getElementById('dbStepsTbody');
    if (!recipeId) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-muted">Sem sessão ativa com receita associada.</td></tr>';
      return;
    }
    fetch(widgetIdUrl(recipeStepsJsonUrlTemplate, recipeId)).then(function (r) { return r.json(); }).then(function (data) {
      tbody.innerHTML = '';
      (data.steps || []).forEach(function (s) {
        const tr = document.createElement('tr');
        const typeBadge = s.step_type === 'alert' ? 'warning' : (s.step_type === 'boil' ? 'danger' : 'primary');
        tr.innerHTML =
          '<td><span class="badge bg-' + typeBadge + '">' + s.step_type + '</span></td>' +
          '<td>' + (s.nome || '—') + '</td>' +
          '<td>' + (s.temperatura !== null && s.temperatura !== undefined ? s.temperatura + '°C' : '—') + '</td>' +
          '<td>' + (s.tempo_min ? s.tempo_min + ' min' : '—') + '</td>' +
          '<td>' + (s.ramp_time_min ? s.ramp_time_min + ' min' : '—') + '</td>' +
          '<td>' + (s.trigger_minutes_remaining !== null && s.trigger_minutes_remaining !== undefined ? '-' + s.trigger_minutes_remaining + ' min do fim' : '—') + '</td>' +
          '<td></td>';
        const actionsTd = tr.lastElementChild;
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn btn-sm btn-outline-secondary me-1';
        editBtn.innerHTML = '<i class="bi bi-pencil"></i>';
        editBtn.addEventListener('click', function () {
          document.getElementById('dbStepFormId').value = s.id;
          document.getElementById('dbStepFormType').value = s.step_type;
          document.getElementById('dbStepFormNome').value = s.nome || '';
          document.getElementById('dbStepFormTemperatura').value = s.temperatura !== null && s.temperatura !== undefined ? s.temperatura : '';
          document.getElementById('dbStepFormTempoMin').value = s.tempo_min || '';
          document.getElementById('dbStepFormRampTimeMin').value = s.ramp_time_min || '';
          document.getElementById('dbStepFormTrigger').value = s.trigger_minutes_remaining !== null && s.trigger_minutes_remaining !== undefined ? s.trigger_minutes_remaining : '';
          document.getElementById('dbStepFormTitle').textContent = 'Editar Etapa';
          document.getElementById('dbStepFormSaveBtn').innerHTML = '<i class="bi bi-check-lg"></i> Salvar';
          document.getElementById('dbStepFormCancelBtn').classList.remove('d-none');
          syncStepFormFields();
        });
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn btn-sm btn-outline-danger';
        delBtn.innerHTML = '<i class="bi bi-trash"></i>';
        delBtn.addEventListener('click', function () {
          if (!confirm('Remover esta etapa da receita?')) return;
          fetch(widgetIdUrl(recipeDeleteStepUrlTemplate, s.id), { method: 'POST' }).then(loadStepsList);
        });
        actionsTd.appendChild(editBtn);
        actionsTd.appendChild(delBtn);
        tbody.appendChild(tr);
      });
      if (!(data.steps || []).length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-muted">Nenhuma etapa ainda.</td></tr>';
      }
    });
  }

  document.querySelectorAll('.db-steps-manage-btn').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      resetStepForm();
      loadStepsList();
      stepsModal.show();
    });
  });

  document.getElementById('dbStepForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const recipeId = lastSnapshot && lastSnapshot.active_recipe_id;
    if (!recipeId) return;
    const stepId = document.getElementById('dbStepFormId').value;
    const payload = {
      step_type: document.getElementById('dbStepFormType').value,
      nome: document.getElementById('dbStepFormNome').value,
      temperatura: document.getElementById('dbStepFormTemperatura').value ? parseFloat(document.getElementById('dbStepFormTemperatura').value) : null,
      tempo_min: document.getElementById('dbStepFormTempoMin').value ? parseInt(document.getElementById('dbStepFormTempoMin').value, 10) : null,
      ramp_time_min: document.getElementById('dbStepFormRampTimeMin').value ? parseInt(document.getElementById('dbStepFormRampTimeMin').value, 10) : null,
      trigger_minutes_remaining: document.getElementById('dbStepFormTrigger').value ? parseInt(document.getElementById('dbStepFormTrigger').value, 10) : null,
    };
    const url = stepId ? widgetIdUrl(recipeUpdateStepUrlTemplate, stepId) : widgetIdUrl(recipeAddStepUrlTemplate, recipeId);
    fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data.ok) { resetStepForm(); loadStepsList(); } else { alert(data.error || 'Erro ao salvar etapa.'); }
    });
  });

  document.getElementById('dbStepsResyncBtn').addEventListener('click', function () {
    const sessionId = lastSnapshot && lastSnapshot.active_session_id;
    if (!sessionId) { alert('Sem sessão ativa pra ressincronizar.'); return; }
    fetch(widgetIdUrl(resyncStepsUrlTemplate, sessionId), { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) { refresh(); } else { alert(data.error || 'Erro ao ressincronizar.'); }
      });
  });

  // Restaura o modo edição salvo (achado real: salvar algo no editor
  // não deve devolver a tela pra visualização — só sair pelo botão).
  try {
    if (sessionStorage.getItem(editModeStorageKey) === '1') applyEditMode(true);
  } catch (e) { /* modo privado etc — ignora, começa em visualização */ }

  refresh();
  const dbPollHandle = setInterval(refresh, 3000);

  // Achado da conversa (workspace consolidado em abas): quando esta tela
  // é carregada como fragmento AJAX dentro de outra aba, a casca precisa
  // de um jeito de "desligar" o polling ao trocar de aba — senão o
  // setInterval continua rodando escondido pra sempre a cada vez que a
  // aba Dashboard é reaberta. Convenção: window.__tabCleanup.
  window.__tabCleanup = function () { clearInterval(dbPollHandle); };
})();
</script>

.db-edit-mode .db-widget { cursor: move; outline: 1px dashed rgba(255,255,255,.25); }
.db-resize-handle {
  position: absolute; right: -4px; bottom: -4px; width: 14px; height: 14px;
  background: #f0932b; border-radius: 3px; cursor: nwse-resize; z-index: 999;
}
