{% macro maintenance_action(kind, row, action, disabled=false) %}
<form method="post" class="pw-process-mutation d-inline-block" action="{{ url_for('plant_workspace.maintain_workspace_configuration', plant_id=plant.id, kind=kind, record_id=row.id, action=action) }}" data-confirm-key="brewstation_mashctrl.maintenance.confirm_{{ action }}" data-confirm-missing="{{ t('brewstation_mashctrl.conversion.confirm_missing') }}"><button type="submit" class="btn btn-sm btn-outline-secondary" {{ 'disabled' if disabled else '' }}>{{ t('brewstation_mashctrl.preparation.' ~ action) }}</button></form>
{% endmacro %}
