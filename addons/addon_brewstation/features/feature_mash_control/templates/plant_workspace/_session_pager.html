{% macro pager(page, label) %}
<nav class="d-flex justify-content-between align-items-center gap-2 p-2 small" aria-label="Paginação de {{ label }}">
  {% if page.previous_url %}<a href="{{ page.previous_url }}" class="btn btn-sm btn-outline-secondary" data-workspace-history-link>Anterior</a>{% else %}<span></span>{% endif %}
  <span>Página {{ page.page }}</span>
  {% if page.next_url %}<a href="{{ page.next_url }}" class="btn btn-sm btn-outline-secondary" data-workspace-history-link>Próxima</a>{% else %}<span></span>{% endif %}
</nav>
{% endmacro %}
