{# Fragmento AJAX da aba Planta (conversa — workspace consolidado):
   consolida os dados da própria Planta + Tanques + Mapeamentos de
   Planta. Sem <script>/setInterval nesta aba — não precisa do hook
   window.__tabCleanup. #}

<div class="card bg-dark border-secondary mb-3">
  <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div>
      <h5 class="mb-1">{{ plant.name }}</h5>
      <div class="small text-muted">
        {{ plant.capacity_liters ~ ' L' if plant.capacity_liters is not none else 'Capacidade não informada' }}
        · {{ plant.vessel_count or 0 }} tanque(s) previsto(s)
        · <span class="badge {{ 'bg-success' if plant.is_active else 'bg-secondary' }}">{{ 'Ativa' if plant.is_active else 'Inativa' }}</span>
      </div>
      {% if plant.description %}
      <p class="small mt-2 mb-0">{{ plant.description }}</p>
      {% endif %}
    </div>
    <a href="{{ url_for('brew_plants.detail', id=plant.id) }}" target="_blank" class="btn btn-sm btn-outline-light">
      <i class="bi bi-pencil"></i> Editar Planta
    </a>
  </div>
</div>

<div class="card bg-dark border-secondary mb-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span><i class="bi bi-cup-straw"></i> Tanques</span>
    <a href="{{ url_for('brew_plant_vessels.manage') }}" target="_blank" class="btn btn-sm btn-outline-success">
      <i class="bi bi-plus-lg"></i> Novo Tanque
    </a>
  </div>
  <div class="table-responsive">
    <table class="table table-dark table-sm mb-0">
      <thead><tr><th>Ordem</th><th>Nome</th><th>Tipo</th><th>Descrição</th><th></th></tr></thead>
      <tbody>
        {% for vessel in vessels %}
        <tr>
          <td>{{ vessel.position_order or '—' }}</td>
          <td>{{ vessel.label_text }}</td>
          <td>{{ vessel.vessel_type.replace('_', ' ').title() }}</td>
          <td class="small text-muted">{{ vessel.description or '—' }}</td>
          <td>
            <a href="{{ url_for('brew_plant_vessels.detail', id=vessel.id) }}" target="_blank" class="small">
              <i class="bi bi-pencil"></i>
            </a>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="text-muted small">Nenhum Tanque cadastrado ainda pra esta Planta.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<div class="card bg-dark border-secondary">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span><i class="bi bi-diagram-2"></i> Mapeamentos de Planta</span>
    <a href="{{ url_for('brew_plant_mappings.manage') }}" target="_blank" class="btn btn-sm btn-outline-success">
      <i class="bi bi-plus-lg"></i> Novo Mapeamento
    </a>
  </div>
  <div class="table-responsive">
    <table class="table table-dark table-sm mb-0">
      <thead><tr><th>Tanque</th><th>Papel</th><th>Function do dispositivo</th><th>Obrigatório</th><th></th></tr></thead>
      <tbody>
        {% for mapping in mappings %}
        <tr>
          <td>{{ vessels_by_id.get(mapping.vessel_id).label_text if vessels_by_id.get(mapping.vessel_id) else '—' }}</td>
          <td>{{ mapping.role_key }}</td>
          <td>{{ mapping.device_function_name }}</td>
          <td>{{ '✓' if mapping.is_required else '—' }}</td>
          <td>
            <a href="{{ url_for('brew_plant_mappings.detail', id=mapping.id) }}" target="_blank" class="small">
              <i class="bi bi-pencil"></i>
            </a>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="text-muted small">Nenhum Mapeamento cadastrado ainda pra esta Planta.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
