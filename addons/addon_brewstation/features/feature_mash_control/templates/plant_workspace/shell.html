{% extends "core/base.html" %}
{% block title %}{{ plant.name }} - Workspace{% endblock %}
{% block content %}
<div class="pagetitle d-flex justify-content-between align-items-center flex-wrap gap-2">
  <h1><i class="bi bi-diagram-3"></i> {{ plant.name }}</h1>
  <div class="d-flex gap-2">
    <button type="button" id="pwKioskToggle" class="btn btn-sm btn-outline-warning" title="Modo Kiosk (tela cheia) — Esc ou Ctrl+Shift+K pra sair">
      <i class="bi bi-arrows-fullscreen"></i> Modo Kiosk
    </button>
    <a href="{{ url_for('plant_workspace.landing') }}" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Trocar de Planta
    </a>
  </div>
</div>

<ul class="nav nav-tabs mb-3" id="pwTabBar">
  {% for tab in tabs %}
  <li class="nav-item">
    <button type="button"
            class="nav-link {{ 'active' if loop.first else '' }} {{ 'disabled' if not tab.enabled else '' }}"
            id="pwTab-{{ tab.key }}"
            data-tab-key="{{ tab.key }}"
            {% if not tab.enabled %}disabled title="Em breve"{% endif %}>
      <i class="bi {{ tab.icon }}"></i> {{ tab.label }}
    </button>
  </li>
  {% endfor %}
</ul>

<div id="pwTabContent">
  <div class="text-center text-muted p-5"><div class="spinner-border spinner-border-sm"></div> Carregando...</div>
</div>

<style>
/* Modo Kiosk (conversa): esconde header/sidebar do próprio Tesseract —
   sozinho, o Fullscreen API do navegador não faria isso, já que eles
   continuariam "atrás" da tela cheia. Escopado a esta tela via classe
   no body, não toca no tema global. */
body.pw-kiosk-mode #header,
body.pw-kiosk-mode #sidebar { display: none !important; }
body.pw-kiosk-mode #main { margin-left: 0 !important; padding-top: 12px !important; }
</style>
{% endblock %}

{% block extra_js %}
<script>
(function () {
  const plantId = {{ plant.id }};
  const tabContent = document.getElementById('pwTabContent');
  const tabUrls = {
    dashboard: "{{ url_for('plant_workspace.tab_dashboard', plant_id=plant.id) }}",
    sessions: "{{ url_for('plant_workspace.tab_sessions', plant_id=plant.id) }}",
    plant: "{{ url_for('plant_workspace.tab_plant', plant_id=plant.id) }}",
    recipe: "{{ url_for('plant_workspace.tab_recipe', plant_id=plant.id) }}",
    automation: "{{ url_for('plant_workspace.tab_automation', plant_id=plant.id) }}",
  };

  // Convenção (conversa — workspace consolidado): cada fragmento de aba
  // que precisa de limpeza (polling, listeners globais) expõe
  // window.__tabCleanup antes de terminar de rodar. A casca chama isso
  // sempre ANTES de trocar de aba — sem isso, o setInterval do
  // Dashboard (por exemplo) continuaria rodando escondido pra sempre a
  // cada reabertura da aba.
  function teardownCurrentTab() {
    if (window.__tabCleanup) {
      try { window.__tabCleanup(); } catch (e) { console.warn('erro ao limpar aba anterior', e); }
      window.__tabCleanup = null;
    }
  }

  // <script> injetado via innerHTML não executa sozinho (comportamento
  // padrão do browser) — recria cada tag pra forçar a execução. Exposto
  // em window pra ser reaproveitado por sub-navegações DENTRO de uma
  // aba (ex.: trocar de sessão na aba Sessões, sem passar pela casca).
  function executeScripts(container) {
    container.querySelectorAll('script').forEach(function (oldScript) {
      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(function (attr) {
        newScript.setAttribute(attr.name, attr.value);
      });
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }
  window.__executeScripts = executeScripts;

  function loadUrl(url) {
    teardownCurrentTab();
    currentTabUrl = url;
    tabContent.innerHTML = '<div class="text-center text-muted p-5"><div class="spinner-border spinner-border-sm"></div> Carregando...</div>';
    fetch(url)
      .then(function (r) { return r.text(); })
      .then(function (html) {
        tabContent.innerHTML = html;
        executeScripts(tabContent);
      })
      .catch(function () {
        tabContent.innerHTML = '<div class="alert alert-danger">Erro ao carregar esta aba.</div>';
      });
  }

  // Rastreia a URL do fragmento atualmente carregado (pode ter sido
  // trocada por sub-navegação DENTRO da aba, não só pela troca de aba
  // top-level — ex.: escolher uma sessão diferente, escolher uma
  // receita diferente). Exposto pra qualquer fragmento reaproveitar:
  // - window.__workspaceLoadUrl(url): navega a aba atual pra outra URL
  //   (ex.: escolher outra sessão/receita), sem sair do workspace.
  // - window.__workspaceReloadCurrent(): recarrega a MESMA URL já
  //   carregada (ex.: depois de adicionar/remover algo), sem precisar
  //   saber qual URL é — útil pra scripts compartilhados entre a tela
  //   cheia (onde fariam window.location.reload()) e o fragmento.
  let currentTabUrl = null;
  window.__workspaceLoadUrl = loadUrl;
  window.__workspaceReloadCurrent = function () {
    if (currentTabUrl) loadUrl(currentTabUrl);
  };

  function loadTab(key) {
    const url = tabUrls[key];
    if (!url) return; // aba ainda não tem rota de fragmento (fase seguinte)
    loadUrl(url);
  }

  document.querySelectorAll('#pwTabBar .nav-link').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      document.querySelectorAll('#pwTabBar .nav-link').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      loadTab(btn.dataset.tabKey);
    });
  });

  // Aba inicial: a primeira habilitada na lista (Dashboard, fase 1).
  const firstEnabled = document.querySelector('#pwTabBar .nav-link:not(.disabled)');
  if (firstEnabled) loadTab(firstEnabled.dataset.tabKey);

  // Se o usuário sair do workspace (navegar pra outra página de
  // verdade), garante que o polling da aba atual não fica pra trás.
  window.addEventListener('beforeunload', teardownCurrentTab);

  // ── Modo Kiosk (conversa) — combina duas coisas: Fullscreen API do
  // navegador (não cobre sozinha o header/sidebar do próprio Tesseract,
  // que continuariam visíveis "atrás" da tela cheia) + esconder o chrome
  // do Tesseract via classe no <body>. Cobre a Workspace inteira (as 5
  // abas), não só o Dashboard — decisão da conversa, já que fica
  // centralizado aqui na casca em vez de duplicado em cada aba.
  const kioskBtn = document.getElementById('pwKioskToggle');
  const KIOSK_CLASS = 'pw-kiosk-mode';

  function enterKiosk() {
    document.body.classList.add(KIOSK_CLASS);
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(function () { /* navegador recusou — segue só com o chrome escondido */ });
  }

  function exitKiosk() {
    document.body.classList.remove(KIOSK_CLASS);
    // Esc nativo já pode ter saído do fullscreen sozinho (fullscreenchange
    // cobre isso); aqui garantimos o caminho inverso também — atalho
    // Ctrl+Shift+K ou botão sai do fullscreen mesmo se o body ainda
    // achasse que estava dentro dele.
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document).catch(function () { /* ignora */ });
    }
  }

  kioskBtn.addEventListener('click', function () {
    if (document.body.classList.contains(KIOSK_CLASS)) exitKiosk(); else enterKiosk();
  });

  // Esc reforçado: o navegador já sai do fullscreen sozinho com Esc, mas
  // isso não desfaz o header/sidebar escondido — este listener sincroniza
  // os dois sempre que o fullscreen muda por qualquer via (Esc, F11, etc).
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (evt) {
    document.addEventListener(evt, function () {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        document.body.classList.remove(KIOSK_CLASS);
      }
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k')) {
      e.preventDefault();
      if (document.body.classList.contains(KIOSK_CLASS)) exitKiosk(); else enterKiosk();
    }
  });
})();
</script>
{% endblock %}
