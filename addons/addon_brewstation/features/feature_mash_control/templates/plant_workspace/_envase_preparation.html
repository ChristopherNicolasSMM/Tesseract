{% if current_user.has_permission('envases.create') %}
<details class="mt-3" id="pwEnvasePreparation">
  <summary>Preparar envase deste lote</summary>
  <p class="small text-muted mt-2">Confira o produto, volume e embalagens antes de registrar. A prévia não grava envase, não confirma ingredientes e não reserva estoque.</p>
  <form id="pwEnvasePreparationForm" method="get" action="{{ url_for('plant_workspace.prepare_session_envase', plant_id=plant.id, session_id=selected_session.id) }}" class="row g-2">
    <div class="col-md-7">
      <label for="pwEnvaseProduct" class="form-label">Material resultante</label>
      <div class="weakref-combo" data-weakref-source="materials">
        <input type="hidden" class="weakref-combo-value" name="material_resultante_id">
        <input id="pwEnvaseProduct" type="text" class="form-control weakref-combo-search" placeholder="Buscar produto..." autocomplete="off">
        <ul class="weakref-combo-results"></ul>
      </div>
    </div>
    <div class="col-md-5">
      <label for="pwEnvaseLiters" class="form-label">Quantidade a envasar (L)</label>
      <input id="pwEnvaseLiters" name="quantidade_litros" type="number" min="0" step="any" class="form-control" required>
    </div>
    <div class="col-md-6"><label for="pwEnvaseDate" class="form-label">Data do envase (opcional)</label><input id="pwEnvaseDate" name="data_envase" type="date" class="form-control"></div>
    <div class="col-md-6"><label for="pwEnvaseType" class="form-label">Tipo de envase (opcional)</label><input id="pwEnvaseType" name="tipo_envase" class="form-control" maxlength="30" placeholder="Ex.: garrafa, barril ou lata"></div>
    <div class="col-12"><button type="submit" class="btn btn-outline-primary">Consultar prévia de embalagens</button></div>
  </form>
  <div id="pwEnvasePreview" class="mt-3" aria-live="polite"></div>
</details>
<script>
(function () {
  const form = document.getElementById('pwEnvasePreparationForm');
  const output = document.getElementById('pwEnvasePreview');
  const button = form.querySelector('button[type="submit"]');
  if (window.TesseractWeakRef) window.TesseractWeakRef.init(form);
  let revision = 0;
  let pending = false;
  let registering = false;
  function clearPreview() { if (registering) return; revision += 1; output.replaceChildren(); }
  form.addEventListener('input', clearPreview);
  form.addEventListener('change', clearPreview);
  // Compatibilidade com fragmentos servidos antes da atualização do Core.
  form.addEventListener('click', function (event) {
    if (event.target.closest('.weakref-combo-results li')) clearPreview();
  });
  output.addEventListener('submit', async function (event) {
    const registration = event.target.closest('.pw-register-envase-form');
    if (!registration) return;
    event.preventDefault();
    if (pending) return;
    const submit = registration.querySelector('button[type="submit"]');
    pending = true;
    registering = true;
    const inputs = Array.from(form.querySelectorAll('input'));
    inputs.forEach(function (input) { input.disabled = true; });
    submit.disabled = true;
    button.disabled = true;
    try {
      if (!window.__tesseractConfirm) throw new Error('Confirmação indisponível. Recarregue a página.');
      const confirmed = await window.__tesseractConfirm({
        key: 'brewstation_mashctrl.workspace.confirm_register_envase',
        params: { product: registration.dataset.product, liters: registration.dataset.liters,
                  ingredients: registration.dataset.ingredients },
      });
      if (!confirmed || !registration.isConnected) return;
      const response = await fetch(registration.action, { method: 'POST',
        body: new FormData(registration), headers: { 'X-Requested-With': 'XMLHttpRequest' } });
      if (!(response.headers.get('content-type') || '').includes('application/json')) throw new Error('Não foi possível confirmar a resposta. Tente novamente com esta mesma confirmação.');
      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error(result.error || 'Não foi possível registrar o envase.');
      window.__tesseractToast.show(result.message, 'success');
      if (form.isConnected) window.__workspaceLoadUrl(result.url);
    } catch (error) {
      if (form.isConnected && window.__tesseractToast) window.__tesseractToast.show(error.message, 'error');
    } finally {
      pending = false;
      registering = false;
      inputs.forEach(function (input) { input.disabled = false; });
      submit.disabled = false;
      button.disabled = false;
    }
  });
  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    if (pending) return;
    const requestRevision = revision;
    output.replaceChildren();
    pending = true;
    button.disabled = true;
    try {
      if (!form.querySelector('[name="material_resultante_id"]').value) throw new Error('Selecione o material resultante no combo de busca.');
      const url = new URL(form.action, window.location.origin);
      new FormData(form).forEach(function (value, key) { url.searchParams.set(key, value); });
      const response = await fetch(url.href, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
      if (!form.isConnected || requestRevision !== revision) return;
      if (!(response.headers.get('content-type') || '').includes('application/json')) throw new Error('Não foi possível consultar a prévia. Recarregue a página.');
      const result = await response.json();
      if (!form.isConnected || requestRevision !== revision) return;
      if (!response.ok || !result.ok) throw new Error(result.error || 'Não foi possível consultar a prévia.');
      output.innerHTML = result.html;
    } catch (error) {
      if (form.isConnected && requestRevision === revision && window.__tesseractToast) window.__tesseractToast.show(error.message, 'error');
    } finally {
      pending = false;
      button.disabled = false;
    }
  });
})();
</script>
{% endif %}
