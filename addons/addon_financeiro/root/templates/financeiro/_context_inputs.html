{% for key,value in fw.items() if key in ['organization_code','date_from','date_to','account_id','tab','view'] %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}

{% for key in ['scope','days','category_id','cost_center_id','source','direction'] if request.args.get(key) %}<input type="hidden" name="{{ key }}" value="{{ request.args[key] }}">{% endfor %}
