<label class="form-label" for="organization_code">Organização</label><select class="form-select" id="organization_code" name="organization_code" required><option value="">Selecione</option>{% for org in organizations if org.is_active %}<option value="{{ org.code }}" {% if values.get('organization_code',selected_code)==org.code %}selected{% endif %}>{{ org.code }} — {{ org.name }}</option>{% endfor %}</select>
