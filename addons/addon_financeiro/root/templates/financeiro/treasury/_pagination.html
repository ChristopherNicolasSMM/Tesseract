<nav aria-label="Paginação"><ul class="pagination pagination-sm justify-content-center mb-3">{% if page > 1 %}<li class="page-item"><a class="page-link" href="?organization_code={{ selected_code|urlencode }}&q={{ search|default('')|urlencode }}&page={{ page-1 }}{% if kind_filter|default('') %}&kind={{ kind_filter }}{% endif %}">Anterior</a></li>{% endif %}<li class="page-item active"><span class="page-link">{{ page }} / {{ pages }}</span></li>{% if page < pages %}<li class="page-item"><a class="page-link" href="?organization_code={{ selected_code|urlencode }}&q={{ search|default('')|urlencode }}&page={{ page+1 }}{% if kind_filter|default('') %}&kind={{ kind_filter }}{% endif %}">Próxima</a></li>{% endif %}</ul></nav>
