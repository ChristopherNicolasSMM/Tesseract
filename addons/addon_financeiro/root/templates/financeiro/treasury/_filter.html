<form method="get" class="row g-2 mb-3 align-items-end">{% if kind_filter|default('') %}<input type="hidden" name="kind" value="{{ kind_filter }}">{% endif %}
<div class="col-md-5"><label class="form-label" for="filter-org">Filtrar organização / carregar opções</label><select class="form-select" name="organization_code" id="filter-org"><option value="">Todas (histórico)</option>{% for org in organizations %}<option value="{{ org.code }}" {% if selected_code==org.code %}selected{% endif %}>{{ org.code }} — {{ org.name }}{% if not org.is_active %} (inativa){% endif %}</option>{% endfor %}</select></div>
<div class="col-md-5"><label class="form-label" for="filter-q">Buscar</label><input class="form-control" id="filter-q" name="q" value="{{ search|default('') }}"></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-outline-primary"><i class="bi bi-search"></i> Filtrar</button></div><div class="col-12"><span class="badge bg-secondary"><i class="bi bi-list-ul me-1"></i>{{ total }} registro(s)</span></div></form>
